<!-- Custom styles -->
<link
  rel="stylesheet"
  href="{{ '/assets/css/custom-search.css' | relative_url }}"
>

{% if page.collection == "posts" %}
  <link rel="stylesheet" href="{{ '/assets/css/post.css' | relative_url }}">
{% endif %}

<script>
  window.MathJax = {
    tex: {
      inlineMath: [['$', '$'], ['\\(', '\\)']],
      displayMath: [['$$', '$$'], ['\\[', '\\]']],
      processEscapes: true
    }
  };
</script>

<script
  id="MathJax-script"
  async
  src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js">
</script>

<link
  rel="stylesheet"
  href="{{ '/assets/css/site-custom.css' | relative_url }}"
>

<link
  id="dark-mode-stylesheet"
  rel="stylesheet"
  href="{{ '/assets/css/dark-mode.css' | relative_url }}"
  disabled
>

<script>
  (function () {
    if (localStorage.getItem("abr-theme") === "dark") {
      document.getElementById("dark-mode-stylesheet").disabled = false;
      document.documentElement.dataset.theme = "dark";
    }
  })();
</script>
